name: Rename deploy file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index with updated build
        run: |
          git config user.name "engowra"
          git config user.email "engowra@users.noreply.github.com"
          rm index.html
          mv ielts-website-prototype.html index.html
          rm .github/workflows/rename.yml
          git add -A
          git commit -m 'Engowra modules expanded — 8 sets per module, 32 tests total'
          git push
