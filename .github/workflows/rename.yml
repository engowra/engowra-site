name: Rename site file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv ielts-website-prototype.html index.html
          rm -rf .github/workflows/rename.yml
          git add -A
          git commit -m "Engowra tools live — grammar, Eng-Urdu dictionary, synonyms + 5 more auto tools"
          git push
